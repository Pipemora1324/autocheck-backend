name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: autocheck
          # Contenedor desechable de este job: sin contraseña, para no guardar credenciales ni de mentira.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: autocheck_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autocheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base desechable de este job. Gemini siempre está simulado: aquí no hay ninguna clave ni secreto.
      TEST_DATABASE_URL: postgres://autocheck@localhost:5432/autocheck_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
