services:
  - type: web
    name: autocheck-backend
    runtime: node
    plan: free
    # Elige la región más cercana a la de tu proyecto de Neon (ver DEPLOY.md).
    region: virginia
    branch: main
    autoDeploy: true
    # NODE_ENV=production omite devDependencies; TypeScript las necesita para compilar.
    buildCommand: npm ci --include=dev && npm run build
    # Las migraciones corren antes de levantar el servidor; si fallan, el deploy no arranca.
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /health
    # Solo las variables de la configuración recomendada (DEPLOY.md, paso 2). "sync: false" = la cargas tú en Render.
    envVars:
      # --- Obligatorias ---
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      # Correo por la API HTTPS de Brevo: Render gratuito bloquea los puertos SMTP.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: AutoCheck-CO
      # El frontend llama a /api/* en Vercel, que reenvía a Render: el navegador ve /api/auth/...
      - key: COOKIE_PATH
        value: /api/auth
      - key: COOKIE_SAMESITE
        value: strict
      # Vercel (rewrite) + balanceador de Render = 2 proxies delante de Express.
      - key: TRUST_PROXY
        value: '2'
      # --- Opcionales (pueden quedar vacías) ---
      # Correos que reciben rol admin al verificar su correo, separados por coma.
      - key: ADMIN_EMAILS
        sync: false
      # Lectura de la tarjeta y diagnostico de testigos con Gemini (plan gratuito).
      # Sin GEMINI_API_KEY, ambos responden 503; la eleccion manual del testigo sigue funcionando.
      - key: SCAN_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
